<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inversor híbrido: fluxo de energia</title>
<style>
:root{--bg:#fbfaf8;--fg:#1d2127;--mut:#5f6772;--card:#e9ebee;--line:#98a1ac;--pv:#d98200;--bat:#16955a;--grid:#2860d8;--bad:#d42b2b;--ctl:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181c;--fg:#e8eaed;--mut:#9aa3ad;--card:#262b31;--line:#5d6670;--pv:#f2a93b;--bat:#3ccf85;--grid:#6b9bff;--bad:#ff6b6b;--ctl:#1e2227;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15181c;--fg:#e8eaed;--mut:#9aa3ad;--card:#262b31;--line:#5d6670;--pv:#f2a93b;--bat:#3ccf85;--grid:#6b9bff;--bad:#ff6b6b;--ctl:#1e2227;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding:14px;max-width:980px;margin-inline:auto}
h1{font-size:20px;margin:0 0 10px;font-weight:650}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-bottom:10px}
.g{background:var(--ctl);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.g b{display:block;font-size:13px;color:var(--mut);font-weight:550;margin-bottom:4px}
.seg{display:flex;gap:6px}
button{flex:1;font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
button[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button:focus-visible,input:focus-visible{outline:2px solid var(--grid);outline-offset:2px}
input[type=range]{width:100%}
label{display:flex;justify-content:space-between;font-size:13px;color:var(--mut)}
.wrap{overflow-x:auto}
svg{width:100%;min-width:640px;height:auto;display:block}
svg text{fill:var(--fg);font:13px system-ui,sans-serif}
svg .m{fill:var(--mut);font-size:11.5px}
.w{stroke:var(--line);stroke-width:4;fill:none;stroke-linecap:round}
.bx{fill:var(--card);stroke:var(--line);stroke-width:2}
@keyframes flow{from{stroke-dashoffset:var(--o)}to{stroke-dashoffset:calc(var(--o) - var(--p))}}
@media (prefers-reduced-motion:reduce){#fl path{animation-duration:6s!important}}
#st{margin:8px 0 0;padding:10px 12px;border-left:4px solid var(--grid);background:var(--ctl);border-radius:0 8px 8px 0}
#st.bad{border-color:var(--bad)}
#rd{margin:8px 0 0;color:var(--mut);font-size:13px}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin-top:6px}
.lg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
</style></head><body>
<h1>Inversor híbrido: FV, bateria, rede, EPS e chave de comutação</h1>
<div class="ctl">
 <div class="g"><b>Cenário</b><div class="seg"><button data-k="scn" data-v="A">A: tudo prioritário</button><button data-k="scn" data-v="B">B: prioritária + normal</button></div></div>
 <div class="g"><b>Chave de comutação</b><div class="seg"><button data-k="sw" data-v="inv">A · Inversor (EPS)</button><button data-k="sw" data-v="grid">B · Rede (bypass)</button></div></div>
 <div class="g"><b>Rede elétrica</b><div class="seg"><button data-k="grid" data-v="1">Presente</button><button data-k="grid" data-v="0">Falta de rede</button></div></div>
 <div class="g"><label>Geração FV <span id="v_pv"></span></label><input type="range" id="pv" min="0" max="6" step="0.5"></div>
 <div class="g"><label><span id="lp">Cargas prioritárias</span><span id="v_prio"></span></label><input type="range" id="prio" min="0" max="8" step="0.5"></div>
 <div class="g"><label>Cargas normais <span id="v_norm"></span></label><input type="range" id="norm" min="0" max="5" step="0.5"></div>
 <div class="g"><label>Carga da bateria (SOC) <span id="v_soc"></span></label><input type="range" id="soc" min="0" max="100" step="1"><label style="margin-top:4px"><span><input type="checkbox" id="sim" checked> Simular variação do SOC</span></label></div>
</div>
<div class="wrap"><svg viewBox="0 0 900 570" role="img" aria-label="Diagrama de ligação do inversor híbrido">
 <defs><marker id="ar" markerWidth="1" markerHeight="1"></marker></defs>
 <!-- fios -->
 <path class="w" d="M170,200H300M170,320H300M500,200H800M800,80V320M500,320H560M620,400V470M800,320H680"/>
 <path class="w" id="bus2" d="M800,320V440"/>
 <!-- proteções -->
 <g class="bx"><rect x="640" y="192" width="30" height="16" rx="3"/><rect x="516" y="312" width="30" height="16" rx="3"/><rect x="722" y="312" width="30" height="16" rx="3"/></g>
 <text class="m" x="655" y="186" text-anchor="middle">DJ</text><text class="m" x="531" y="306" text-anchor="middle">DJ</text><text class="m" x="737" y="306" text-anchor="middle">DJ</text>
 <!-- fontes -->
 <rect class="bx" x="40" y="155" width="130" height="90" rx="8"/><text x="105" y="195" text-anchor="middle" font-weight="600">Painéis FV</text><text class="m" x="105" y="215" text-anchor="middle">entrada CC (MPPT)</text>
 <rect class="bx" x="735" y="20" width="130" height="60" rx="8"/><text x="800" y="46" text-anchor="middle" font-weight="600">Rede</text><text class="m" x="800" y="64" text-anchor="middle">concessionária</text>
 <rect class="bx" x="300" y="160" width="200" height="200" rx="10"/><text x="400" y="250" text-anchor="middle" font-weight="650">Inversor híbrido</text><text class="m" x="400" y="270" text-anchor="middle">FV + bateria + rede + EPS</text>
 <text class="m" x="308" y="196">FV</text><text class="m" x="308" y="316">BAT</text><text class="m" x="492" y="196" text-anchor="end">REDE</text><text class="m" x="492" y="316" text-anchor="end">EPS</text>
 <g id="bat"></g>
 <!-- chave -->
 <rect x="548" y="290" width="172" height="150" rx="8" fill="none" stroke="var(--line)" stroke-dasharray="5 4"/>
 <text class="m" x="634" y="284" text-anchor="middle">Chave reversora intertravada</text>
 <text class="m" x="560" y="346" text-anchor="middle">A · EPS</text><text class="m" x="680" y="346" text-anchor="middle">B · REDE</text>
 <line id="bl" x1="620" y1="400" x2="560" y2="320" stroke="var(--fg)" stroke-width="6" stroke-linecap="round"/>
 <circle id="ta" cx="560" cy="320" r="6"/><circle id="tb" cx="680" cy="320" r="6"/><circle cx="620" cy="400" r="7" fill="var(--fg)"/>
 <g id="fl"></g>
 <g id="ld"></g>
</svg></div>
<div class="lg"><span><i style="background:var(--pv)"></i>FV</span><span><i style="background:var(--bat)"></i>Bateria</span><span><i style="background:var(--grid)"></i>Rede</span><span><i style="border:2px dashed var(--bad)"></i>Carga sem energia</span></div>
<p id="st"></p><p id="rd"></p>
<script>
/*CALC*/
function calc(s){
 const BM=3,SMIN=10,f={pvp:0,pvb:0,pvn:0,pve:0,bp:0,gpi:0,gpb:0,gn:0,pu:0,nu:0,cur:0};
 const P=s.prio,N=s.scn==='B'?s.norm:0;let pv=s.pv,need=P;
 if(s.sw==='inv'){
  f.pvp=Math.min(pv,need);pv-=f.pvp;need-=f.pvp;
  if(need>0&&s.soc>SMIN){f.bp=Math.min(need,BM);need-=f.bp}
  if(need>0&&s.grid){f.gpi=need;need=0}
  f.pu=need;
 }else{if(s.grid)f.gpb=P;else f.pu=P}
 if(pv>0&&s.soc<100){f.pvb=Math.min(pv,BM);pv-=f.pvb}
 if(s.grid){f.pvn=Math.min(pv,N);pv-=f.pvn;f.pve=pv;pv=0;f.gn=N-f.pvn}
 else{f.nu=N;f.cur=pv;pv=0}
 return f}
/*END*/
const s={scn:'A',sw:'inv',grid:true,pv:4,prio:5,norm:0,soc:60},$=id=>document.getElementById(id);
const A='var(--pv)',B='var(--bat)',G='var(--grid)';
function lines(d,it){it=it.filter(i=>i[1]>.04);if(!it.length)return'';
 const k=it.reduce((a,i)=>a+i[1],0),n=it.length,P=14*n,dur=Math.max(.5,2.2-k*.3),w=Math.min(8,2+k*1.2);
 return it.map((x,i)=>`<path d="${d}" fill="none" stroke="${x[0]}" stroke-width="${w}" stroke-linecap="round" style="stroke-dasharray:5 ${P-5};--o:${-i*14}px;--p:${P}px;animation:flow ${dur}s linear infinite"/>`).join('')}
function box(id,x,y,w,h,title,tot,parts,un){
 let cx=x,o=`<clipPath id="c${id}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8"/></clipPath><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" fill="var(--card)"/><g clip-path="url(#c${id})">`;
 if(tot>0)parts.forEach(p=>{const ww=w*p[1]/tot;if(ww>.1){o+=`<rect x="${cx}" y="${y}" width="${ww}" height="${h}" fill="${p[0]}" opacity=".6"/>`;cx+=ww}});
 const bad=un>.04,pc=tot>0?Math.round(100*(tot-un)/tot):0;
 return o+`</g><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" fill="none" stroke="${bad?'var(--bad)':'var(--line)'}" stroke-width="2"${bad?' stroke-dasharray="5 4"':''}/><text x="${x+w/2}" y="${y+28}" text-anchor="middle" font-weight="600">${title}</text><text x="${x+w/2}" y="${y+50}" text-anchor="middle">${tot.toFixed(1)} kW · ${pc}% atendido</text>`}
function render(){
 const f=calc(s),inv=s.sw==='inv',isB=s.scn==='B';
 const pvU=f.pvp+f.pvb+f.pvn+f.pve,top=f.gpi+f.gpb+f.gn-f.pve,eps=[[A,f.pvp],[B,f.bp],[G,f.gpi]];
 let h='';
 h+=lines('M170,200H300',[[A,pvU]])+lines('M300,320H170',[[A,f.pvb]])+lines('M170,320H300',[[B,f.bp]]);
 h+=lines('M500,200H800',[[A,f.pvn+f.pve]])+lines('M800,200H500',[[G,f.gpi]]);
 h+=top>0?lines('M800,80V200',[[G,top]]):lines('M800,200V80',[[A,-top]]);
 h+=lines('M800,200V320',[[G,f.gpb+f.gn],[A,f.pvn]]);
 if(isB)h+=lines('M800,320V440',[[G,f.gn],[A,f.pvn]]);
 h+=lines('M800,320H680',[[G,f.gpb]]);
 const out=inv?eps:[[G,f.gpb]];
 h+=lines('M500,320H560',eps)+lines(inv?'M560,320L620,400':'M680,320L620,400',out)+lines('M620,400V470',out);
 $('fl').innerHTML=h;
 $('bl').setAttribute('x2',inv?560:680);$('bl').setAttribute('y2',320);
 $('ta').setAttribute('fill',inv?'var(--fg)':'var(--bg)');$('tb').setAttribute('fill',inv?'var(--bg)':'var(--fg)');
 $('ta').setAttribute('stroke','var(--fg)');$('tb').setAttribute('stroke','var(--fg)');
 $('bus2').style.display=isB?'':'none';
 const bh=90*s.soc/100,net=f.pvb-f.bp;
 $('bat').innerHTML=`<clipPath id="cb"><rect x="40" y="275" width="130" height="90" rx="8"/></clipPath><rect x="40" y="275" width="130" height="90" rx="8" fill="var(--card)"/><rect x="40" y="${365-bh}" width="130" height="${bh}" fill="var(--bat)" opacity=".6" clip-path="url(#cb)"/><rect x="40" y="275" width="130" height="90" rx="8" fill="none" stroke="var(--line)" stroke-width="2"/><text x="105" y="310" text-anchor="middle" font-weight="600">Bateria LFP</text><text x="105" y="330" text-anchor="middle">SOC ${Math.round(s.soc)}%</text><text class="m" x="105" y="348" text-anchor="middle">${net>.04?'carregando '+net.toFixed(1)+' kW':f.bp>.04?'descarregando '+f.bp.toFixed(1)+' kW':'em espera'}</text>`;
 let l=box('p',550,470,140,70,isB?'Cargas prioritárias':'Todas as cargas',s.prio,[[A,f.pvp],[B,f.bp],[G,f.gpi+f.gpb]],f.pu);
 if(isB)l+=box('n',735,440,130,70,'Cargas normais',s.norm,[[A,f.pvn],[G,f.gn]],f.nu);
 $('ld').innerHTML=l;
 document.querySelectorAll('[data-k]').forEach(b=>b.setAttribute('aria-pressed',String(s[b.dataset.k])===b.dataset.v||(b.dataset.k==='grid'&&s.grid===(b.dataset.v==='1'))));
 ['pv','prio','norm','soc'].forEach(k=>{$(k).value=s[k];$('v_'+k).textContent=k==='soc'?Math.round(s[k])+'%':(+s[k]).toFixed(1)+' kW'});
 $('norm').disabled=!isB;$('lp').textContent=isB?'Cargas prioritárias':'Carga total (prioritária)';
 let m,bad=false;
 if(!s.grid&&!inv){m='Sem rede e chave em REDE: a EPS está isolada, então as cargas prioritárias ficam sem energia. Mude a chave para Inversor (A).';bad=true}
 else if(!s.grid)m='Modo backup (ilha): o inversor alimenta a EPS com FV e bateria, sem conexão com a rede.'+(isB?' As cargas normais ficam desligadas, pois estão no lado da rede.':'');
 else if(!inv)m='Bypass: as cargas prioritárias são alimentadas direto pela rede e a EPS fica desconectada. FV e bateria só operam pelo lado da rede.';
 else m='Operação normal: a EPS alimenta as prioritárias com FV, bateria e rede (nessa ordem).'+(isB?' As cargas normais ficam no lado da rede e recebem o excedente FV ou a rede.':'');
 if(f.pu>.04&&!bad){m+=' Déficit de '+f.pu.toFixed(1)+' kW nas prioritárias (FV e bateria insuficientes e sem rede).';bad=true}
 if(f.cur>.04)m+=' FV limitada em '+f.cur.toFixed(1)+' kW (sem destino para o excedente).';
 $('st').textContent=m;$('st').className=bad?'bad':'';
 $('rd').textContent=`FV ${(s.pv-f.cur).toFixed(1)} kW · Bateria ${net>=0?'carrega ':'descarrega '}${Math.abs(net).toFixed(1)} kW · Rede ${top>=0?'importa ':'exporta '}${Math.abs(top).toFixed(1)} kW`}
document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const k=b.dataset.k,v=b.dataset.v;s[k]=k==='grid'?v==='1':v;if(k==='scn'){s.prio=v==='A'?5:3;s.norm=v==='A'?0:2}render()});
['pv','prio','norm','soc'].forEach(k=>$(k).oninput=e=>{s[k]=+e.target.value;render()});
setInterval(()=>{if(!$('sim').checked)return;const f=calc(s),n=f.pvb-f.bp;if(Math.abs(n)<.04)return;s.soc=Math.max(0,Math.min(100,s.soc+n*.3));render()},500);
render();
</script></body></html>
